<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IA Instalable</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #0b0c10; --panel: #1f2833; --accent: #45f3ff; --text: #fff; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: var(--panel); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2f3e46; }
        #app-logo { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; border: 1px solid var(--accent); background-color: #000; }
        #install-app-btn { background-color: #2ed573; color: #000; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; display: none; }
        #image-uploader-box { background-color: var(--panel); margin: 10px; padding: 12px; border-radius: 12px; border: 1px dashed var(--accent); }
        .custom-file-btn { background-color: var(--accent); color: #000; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; position: relative; }
        #file-chooser { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        #chat-screen { flex: 1; padding: 15px; overflow-y: auto; background: #11141a; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; margin-bottom: 10px; background-color: var(--panel); }
        #control-bar { padding: 12px; background-color: var(--panel); display: flex; gap: 10px; }
        #user-prompt { flex: 1; background-color: #0b0c10; border: 1px solid #34495e; border-radius: 20px; color: white; padding: 10px; resize: none; height: 20px; }
        #submit-btn { background-color: var(--accent); border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="app-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='35' height='35' viewBox='0 0 24 24' fill='none' stroke='%2345f3ff' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/></svg>">
            <b style="color:var(--accent)">IA INSTALABLE</b>
        </div>
        <button id="install-app-btn">INSTALAR APP</button>
    </header>
    <div id="image-uploader-box">
        <div class="custom-file-btn">
            Seleccionar Imagen de mi Celular
            <input type="file" id="file-chooser" accept="image/*">
        </div>
    </div>
    <div id="chat-screen"><div class="bubble">Introduce tu logo arriba y luego presiona "Instalar App".</div></div>
    <div id="control-bar">
        <textarea id="user-prompt" placeholder="Escribe aquí..."></textarea>
        <button id="submit-btn">></button>
    </div>
    <script>
        const chooser = document.getElementById('file-chooser');
        const logo = document.getElementById('app-logo');
        const installBtn = document.getElementById('install-app-btn');

        // Guardar y cargar la imagen localmente de forma directa
        chooser.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                logo.src = event.target.result;
                localStorage.setItem('pwa_logo', event.target.result);
            };
            reader.readAsDataURL(file);
        });

        window.addEventListener('load', () => {
            const cache = localStorage.getItem('pwa_logo');
            if (cache) logo.src = cache;
        });

        // Activar el botón nativo de instalación
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        // Registrar el Service Worker externo
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
