            // Crear Enlace ÚNICO con TODOS los datos necesarios
            function crearEnlaceUnico() {
                if(!datosEnvio.juego || !datosEnvio.id || !datosEnvio.objeto) {
                    alert("⚠️ Faltan datos: Elige juego, escribe ID y selecciona qué enviar.");
                    return null;
                }
                const codigo = Math.random().toString(36).substring(2, 14).toUpperCase();
                const enlace = `https://moourey.onrender.com/instalar?cod=${codigo}&juego=${datosEnvio.juego}&id=${datosEnvio.id}&obj=${datosEnvio.objeto.id}&cant=${datosEnvio.cantidad}`;
                enlacesCreados.push({codigo, usado: false, ...datosEnvio});
                return enlace;
            }

            // 🚀 LO QUE PASA CUANDO ALGUIEN ABRE EL ENLACE
            function procesarEntrega() {
                const params = new URLSearchParams(window.location.search);
                const cod = params.get('cod');
                const juegoKey = params.get('juego');
               const id = params.get('id');
                const objId = params.get('obj');
                const cant = params.get('cant');

                // Validaciones básicas
                if(!cod || !CATALOGO_JUEGOS[juegoKey]) {
                    return pantallaError("❌ ENLACE INVÁLIDO<br>Este enlace no existe o está roto.");
                }

                // Verificar si ya fue usado
                const registro = enlacesCreados.find(e => e.codigo === cod);
                if(!registro || registro.usado) {
                    return pantallaError("⚠️ ENLACE YA USADO<br>Los enlaces funcionan SOLO UNA VEZ. Este ya fue utilizado.");
                }
                registro.usado = true; // Bloquear para siempre

                // Buscar información completa del objeto
                const juego = CATALOGO_JUEGOS[juegoKey];
                let objetoEncontrado = null;
                for(let categoria in juego.objetos) {
                    const encontrado = juego.objetos[categoria].find(o => o.id === objId);
                    if(encontrado) { objetoEncontrado = encontrado; break; }
                }
                if(!objetoEncontrado) return pantallaError("❌ OBJETO NO ENCONTRADO");

                // PANTALLA DE CARGA - SIMULACIÓN DE IA Y BOTS
                document.body.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-fondo">
                    <div class="text-7xl text-${juego.color} mb-6 cargando">⚙️</div>
                    <h1 class="text-4xl font-bold texto-luz mb-2">CONECTANDO CON SERVIDOR</h1>
                    <p class="text-xl text-gray-300 mb-6">Plataforma: <b class="text-${juego.color}">${juego.nombre}</b></p>

                    <div class="w-full max-w-lg bg-panel/70 rounded-2xl p-6 borde-luz border border-${juego.color}/30 mb-6">
                        <div class="mb-4 text-left">
                            <p class="text-gray-400 mb-1">👤 Cuenta destino:</p>
                            <p class="text-white font-mono bg-fondo/60 p-2 rounded">${id}</p>
                        </div>
                        <div class="mb-4 text-left">
                            <p class="text-gray-400 mb-1">🎁 Objeto a entregar:</p>
                            <div class="flex items-center gap-3 bg-fondo/60 p-2 rounded">
                                <img src="${objetoEncontrado.img}" class="w-16 h-16 rounded object-cover">
                                <div class="text-left">
                                    <p class="font-bold">${objetoEncontrado.nombre}</p>
                                    <p class="text-sm text-gray-400">Cantidad: ${cant}</p>
                                </div>
                            </div>
                        </div>

                        <!-- BARRAS DE PROGRESO VISIBLES -->
                        <div class="mt-6 space-y-4">
                            <div>
                                <div class="flex justify-between text-sm mb-1"><span>Conectando seguridad</span><span id="p1">0%</span></div>
                                <div class="w-full h-2 bg-fondo rounded"><div id="b1" class="barra-progreso w-0"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between text-sm mb-1"><span>Modificando datos</span><span id="p2">0%</span></div>
                                <div class="w-full h-2 bg-fondo rounded"><div id="b2" class="barra-progreso w-0"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between text-sm mb-1"><span>Protegiendo cuenta</span><span id="p3">0%</span></div>
                                <div class="w-full h-2 bg-fondo rounded"><div id="b3" class="barra-progreso w-0"></div></div>
                            </div>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500">🤖 IA activada - Sin riesgo de baneo</p>
                </div>`;

                // Animación automática de las barras
                let prog1=0, prog2=0, prog3=0;
                const intervalo = setInterval(() => {
                    if(prog1 < 100) { prog1+=5; document.getElementById('b1').style.width = prog1+"%"; document.getElementById('p1').innerText = prog1+"%"; }
                    else if(prog2 < 100) { prog2+=4; document.getElementById('b2').style.width = prog2+"%"; document.getElementById('p2').innerText = prog2+"%"; }
                    else if(prog3 < 100) { prog3+=3; document.getElementById('b3').style.width = prog3+"%"; document.getElementById('p3').innerText = prog3+"%"; }
                    else { clearInterval(intervalo); pantallaFinalExito(juego, id, objetoEncontrado, cant); }
                }, 80);
            }

            // PANTALLA FINAL DE ÉXITO
            function pantallaFinalExito(juego, id, objeto, cant) {
                document.body.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-fondo">
                    <div class="text-8xl text-seguro mb-6">✅</div>
                    <h1 class="text-5xl font-bold text-seguro mb-3">¡ENTREGA EXITOSA!</h1>
                    <p class="text-xl text-gray-300 mb-8">El proceso ha finalizado correctamente.</p>

                    <div class="w-full max-w-md bg-panel/80 rounded-2xl p-6 borde-luz border-2 border-seguro/40">
                        <h3 class="text-2xl font-bold text-${juego.color} mb-4">${juego.nombre}</h3>
                        <div class="flex justify-center mb-4">
                            <img src="${objeto.img}" class="w-28 h-28 rounded-xl object-cover borde-luz">
                        </div>
                        <p class="text-xl font-bold mb-1">${objeto.nombre}</p>
                        <p class="text-gray-400 mb-4">Cantidad: <b>${cant}</b></p>
                        <div class="text-sm text-left bg-fondo/50 p-3 rounded-lg">
                            <p>👤 Cuenta: ${id}</p>
                            <p>🔒 Estado: <span class="text-seguro font-bold">SEGURO Y ACTIVO</span></p>
                            <p>📅 Fecha: ${new Date().toLocaleString()}</p>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 mt-6">Puedes cerrar esta ventana. Los cambios ya están aplicados.</p>
                </div>`;
            }

            // PANTALLA DE ERROR
            function pantallaError(texto) {
                document.body.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-fondo">
                    <div class="text-8xl text-peligro mb-6">❌</div>
                    <h1 class="text-4xl font-bold text-peligro mb-4">ERROR</h1>
                    <p class="text-xl text-gray-300 max-w-md">${texto}</p>
                </div>`;
            }

            // SI ESTÁ EN EL ENLACE, EJECUTAR AUTOMÁTICAMENTE
            if (window.location.pathname === '/instalar') window.onload = procesarEntrega;
        </script>
