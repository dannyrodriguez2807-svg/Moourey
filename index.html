<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IA Autónoma Local</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --accent-color: #45f3ff;
            --text-main: #ffffff;
            --text-muted: #c5c6c7;
            --success-color: #2ed573;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-color);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2f3e46;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #app-logo {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--accent-color);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-weight: bold;
        }

        .brand-title {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        /* BOTÓN DE INSTALACIÓN VISIBLE SIEMPRE */
        #install-app-btn {
            background-color: var(--success-color);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(46,213,115,0.4);
            display: block;
        }

        #main-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #image-uploader-box {
            background-color: var(--panel-color);
            margin: 10px;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--accent-color);
        }

        .custom-file-btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            position: relative;
            display: block;
            cursor: pointer;
        }

        #file-chooser {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        #chat-screen {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #11141a;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .user-bubble {
            background: linear-gradient(135deg, #00ced1, #008b8b);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-bubble {
            background-color: var(--panel-color);
            color: #f1f2f6;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #34495e;
        }

        .code-container {
            background-color: #000;
            color: #33ff33;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            display: block;
            margin: 8px 0;
            font-size: 0.85rem;
            border-left: 3px solid var(--accent-color);
        }

        #control-bar {
            padding: 12px;
            background-color: var(--panel-color);
            display: flex;
            gap: 10px;
            border-top: 1px solid #2f3e46;
            align-items: center;
        }

        #user-prompt {
            flex: 1;
            background-color: #0b0c10;
            border: 1px solid #34495e;
            border-radius: 20px;
            color: white;
            padding: 10px 15px;
            resize: none;
            height: 20px;
            font-size: 0.95rem;
            outline: none;
        }

        #submit-btn {
            background-color: var(--accent-color);
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-zone">
            <div id="app-logo">IA</div>
            <div class="brand-title">IA LOCAL</div>
        </div>
        <button id="install-app-btn" type="button">INSTALAR</button>
    </header>

    <div id="main-layout">
        <div id="image-uploader-box">
            <div class="custom-file-btn">
                Seleccionar Imagen de mi Celular
                <input type="file" id="file-chooser" accept="image/*">
            </div>
        </div>

        <div id="chat-screen">
            <div class="bubble ai-bubble"><b>Sistema Inteligencia Artificial</b><br>¡Hola! El entorno se ha desbloqueado. Todos los botones y la barra de entrada inferior están disponibles. Escribe un mensaje para ver cómo la IA responde, genera códigos o redacta discursos sin restricciones.</div>
        </div>
    </div>

    <div id="control-bar">
        <textarea id="user-prompt" placeholder="Escribe aquí tu petición..."></textarea>
        <button id="submit-btn" type="button">&gt;</button>
    </div>

    <script>
        const chatScreen = document.getElementById('chat-screen');
        const userPrompt = document.getElementById('user-prompt');
        const submitBtn = document.getElementById('submit-btn');
        const fileChooser = document.getElementById('file-chooser');
        const appLogo = document.getElementById('app-logo');
        const installBtn = document.getElementById('install-app-btn');

        let appMemory = JSON.parse(localStorage.getItem('ia_local_direct_memory')) || [];

        // Procesar y fijar imagen de forma permanente
        fileChooser.addEventListener('change', function(e) {
            const file = e.target.files;
            if (!file || file.length === 0) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                appLogo.style.backgroundImage = "url('" + base64Data + "')";
                appLogo.style.backgroundSize = 'cover';
                appLogo.style.backgroundPosition = 'center';
                appLogo.innerHTML = '';
                localStorage.setItem('cached_logo_direct', base64Data);
                addBubble("¡Imagen configurada correctamente en el almacenamiento seguro!", "ai-bubble");
            };
            reader.readAsDataURL(file);
        });

        function loadLogo() {
            const cacheLogo = localStorage.getItem('cached_logo_direct');
            if (cacheLogo) {
                appLogo.style.backgroundImage = "url('" + cacheLogo + "')";
                appLogo.style.backgroundSize = 'cover';
                appLogo.style.backgroundPosition = 'center';
                appLogo.innerHTML = '';
            }
        }

        // Lógica de generación del Chat (Blindada para ejecución obligatoria)
        function handleChat() {
            const query = userPrompt.value.trim();
            if (!query) return;

            addBubble(query, 'user-bubble');
            userPrompt.value = '';

            appMemory.push({ role: 'user', content: query });
            localStorage.setItem('ia_local_direct_memory', JSON.stringify(appMemory));

            setTimeout(function() {
                let aiReply = "";
                const cleanQuery = query.toLowerCase();

                if (cleanQuery.includes('hola')) {
                    aiReply = "¡Hola! Estoy respondiendo en tiempo real desde la estructura lógica de tu propio dispositivo móvil móvil.";
                } else if (cleanQuery.includes('codigo') || cleanQuery.includes('código')) {
                    aiReply = "He desarrollado el bloque de código solicitado de forma limpia:\n\n```javascript\nfunction validarSistema() {\n    console.log('Botones y respuestas operando de forma excelente.');\n    return true;\n}\n```";
                } else if (cleanQuery.includes('discurso')) {
                    aiReply = "Compañeros, la tecnología local descentralizada nos otorga el control absoluto sobre las herramientas de software, eliminando los servidores remotos para que la información permanezca intacta en nuestros propios dispositivos.";
                } else {
                    aiReply = "Petición procesada de manera segura: \"" + query + "\". El historial se mantendrá respaldado en la memoria de tu celular de por vida.";
                }

                addBubble(aiReply, 'ai-bubble');
                appMemory.push({ role: 'assistant', content: aiReply });
                localStorage.setItem('ia_local_direct_memory', JSON.stringify(appMemory));
            }, 400);
        }
