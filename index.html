            // CAMBIAR VÍNCULO (CUALQUIER TIPO: GOOGLE-FACEBOOK, ETC)
            cambiarVinculo: function(id, nuevoCorreo, tipoAntiguo, tipoNuevo) {
                return new Promise((resolver) => {
                    setTimeout(() => {
                        resolver({
                            exito: true,

            generarRecursos: function(id) {

                                "2. ESCRITURA EN BASE DE DATOS: COMPLETA",

        // FUNCIONES DEL SISTEMA
        function entrar() {
            let clave = document.getElementById("clave").value.trim();
            if(clave === "") {
                alert("⚠️ ESCRIBE TU CÓDIGO");
                return;
            }
            if(clave !== CLAVE_SECRETA) {
                alert("❌ ACCESO DENEGADO");
                return;
            }

            document.getElementById("login").style.display = "none";
            document.getElementById("contenido").style.display = "block";
            actualizar();
        }

        function actualizar() {
            setInterval(() => {
                let hora = new Date().toLocaleTimeString();
                document.getElementById("estado").innerHTML = `🧠 SISTEMA ACTIVO | ${hora} | 🛡️ INDETECTABLE`;
            }, 1000);
        }

        async function consultar() {
            let id = document.getElementById("idCuenta").value.trim();
            if(!id) {
                alert("⚠️ INGRESA EL ID");
                return;
            }

            document.getElementById("resultado").innerHTML = `
                <div class="bg-fondo p-5 rounded-xl borde-brillante text-center animacion">
                    <h4 class="text-xl font-bold">📡 LEYENDO DATOS...</h4>
                    <p class="text-azul mt-2">Accediendo a servidores de Garena</p>
                </div>
            `;

            const datos = await SISTEMA.leerDatosCuenta(id);

            document.getElementById("resultado").innerHTML = `
                <div class="bg-fondo p-5 rounded-xl borde-brillante mt-4">
                    <h3 class="text-center text-2xl font-bold text-primario mb-4">✅ DATOS OBTENIDOS</h3>
                    <p class="flex justify-between py-2 border-b border-white/10"><span class="font-bold text-azul">ID:</span> <span class="font-black">${datos.id}</span></p>
                    <p class="flex justify-between py-2 border-b border-white/10"><span class="font-bold text-dorado">NOMBRE:</span> <span class="font-black text-xl">${datos.nombre}</span></p>
                    <p class="flex justify-between py-2 border-b border-white/10"><span class="font-bold text-morado">VINCULADO A:</span> <span class="font-black">${datos.vinculado}</span></p>
                    <p class="py-3 px-4 bg-black/70 rounded-lg my-2"><span class="font-bold text-primario">CORREO:</span> <span class="font-black float-right">${datos.correo}</span></p>
                    <p class="flex justify-between py-2"><span class="font-bold text-azul">CORREO SECUNDARIO:</span> <span>${datos.correoSecundario}</span></p>
                    <div class="grid grid-cols-2 gap-3 my-3 bg-black/70 p-3 rounded-lg text-center">
                        <div><p class="font-bold text-dorado">DIAMANTES</p><p class="font-black text-xl">${datos.diamantes}</p></div>
                        <div><p class="font-bold text-azul">ORO</p><p class="font-black text-xl">${datos.oro}</p></div>
                    </div>
                    <p class="flex justify-between py-2"><span class="font-bold text-morado">NIVEL:</span> <span>${datos.nivel}</span></p>
                    <p class="flex justify-between py-2"><span class="font-bold text-azul">REGIÓN:</span> <span>${datos.region}</span></p>
                    <p class="text-center font-bold text-primario text-xl mt-3">${datos.estatus}</p>
                </div>
            `;
        }

        async function cambiar() {
            let id = document.getElementById("idCambiar").value.trim();
            let correo = document.getElementById("nuevoCorreo").value.trim();
            let ant = document.getElementById("tipoAntiguo").value;
            let nue = document.getElementById("tipoNuevo").value;

            if(!id || !correo) {
                alert("⚠️ COMPLETA TODOS LOS CAMPOS");
                return;
            }

            document.getElementById("resultadoCambio").innerHTML = `
                <div class="bg-fondo p-5 rounded-xl borde-rojo text-center animacion">
                    <h4 class="text-xl font-bold text-peligro">🔁 EJECUTANDO CAMBIO...</h4>
                    <p class="text-white mt-2">Modificando registros de la base de datos</p>
                </div>
            `;

            const res = await SISTEMA.cambiarVinculo(id, correo, ant, nue);

            let pasos = "";
            res.pasos.forEach(p => pasos += `<p>${p}</p>`);

            document.getElementById("resultadoCambio").innerHTML = `
                <div class="bg-fondo p-5 rounded-xl borde-rojo mt-4">
                    <h3 class="text-center text-2xl font-bold text-primario mb-3">✅ CAMBIO EXITOSO</h3>
                    <p class="text-center text-xl font-bold text-morado mb-3">${res.tipo}</p>
                    <div class="bg-black/70 p-4 rounded-lg mb-3">${pasos}</div>
                    <p class="text-center text-xl font-bold text-white">${res.resultado}</p>
                    <p class="text-center text-dorado mt-2 text-sm">${res.aviso}</p>
                </div>
            `;
        }

        async function generar() {
            let id = document.getElementById("idGenerar").value.trim();
            if(!id) {
                alert("⚠️ INGRESA EL ID");
                return;
            }

            document.getElementById("resultadoGenerar").innerHTML = `
                <div class="bg-fondo p-5 rounded-xl borde-brillante text-center animacion">
                    <h4 class="text-xl font-bold text-azul">💎 GENERANDO RECURSOS...</h4>
                    <p class="text-white mt-2">Escribiendo en la base de datos</p>
                </div>
            `;

            const res = await SISTEMA.generarRecursos(id);

            let pasos = "";
            res.pasos.forEach(p => pasos += `<p>${p}</p>`);

            document.getElementById("resultadoGenerar").innerHTML = `
                <div class="bg-fondo p-5 rounded-xl borde-brillante mt-4">

                    <div class="bg-black/70 p-4 rounded-lg mb-3">${pasos}</div>
                    <p class="text-center text-dorado mt-2 text-sm">${res.aviso}</p>
                </div>
            `;
        }
