<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLATAFORMA MAESTRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000012;
            color: white;
            font-family: Arial, sans-serif;
        }
        .oculto {
            display: none !important;
        }
        .seleccionado {
            border: 3px solid #10b981 !important;
            transform: scale(1.05);
        }
        .juego-activo {
            background: #a855f7 !important;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- SISTEMA PRINCIPAL -->
    <script>
        // SOLO TU CÉDULA
        const CEDULA = "1048934382";
        let datos = {
            juego: "",
            id: "",
            objeto: null,
            cantidad: 1
        };
        let enlaces = [];

        // CATÁLOGO DE JUEGOS Y OBJETOS CON IMÁGENES
        const JUEGOS = {
            freefire: {
                nombre: "Free Fire",
                color: "#ff5500",
                objetos: {
                    ropa: [
                        {id: "r1", nombre: "Conjunto Dragón", img: "https://via.placeholder.com/200x250/ff5500/ffffff?text=DRAGON", tipo: "ropa"},
                        {id: "r2", nombre: "Conjunto Nocturno", img: "https://via.placeholder.com/200x250/1e1b4b/ffffff?text=NOCTURNO", tipo: "ropa"}
                    ],
                    armas: [
                        {id: "a1", nombre: "AK Evolutiva", img: "https://via.placeholder.com/200x200/ef4444/ffffff?text=AK47", tipo: "arma"},
                        {id: "a2", nombre: "M4 Divina", img: "https://via.placeholder.com/200x200/f59e0b/ffffff?text=M4A1", tipo: "arma"}
                    ],
                    recursos: [
                        {id: "d1", nombre: "Diamantes", img: "https://via.placeholder.com/150x150/f59e0b/ffffff?text=DIAMANTES", tipo: "recurso", cantidad: true},
                        {id: "m1", nombre: "Monedas", img: "https://via.placeholder.com/150x150/eab308/ffffff?text=MONEDAS", tipo: "recurso", cantidad: true}
                    ]
                }
            },
            roblox: {
                nombre: "Roblox",
                color: "#00a2ff",
                objetos: {
                    avatares: [
                        {id: "av1", nombre: "Ninja Legendario", img: "https://via.placeholder.com/200x250/00a2ff/ffffff?text=NINJA", tipo: "avatar"},
                        {id: "av2", nombre: "Héroe Galáctico", img: "https://via.placeholder.com/200x250/7928ca/ffffff?text=HEROE", tipo: "avatar"}
                    ],
                    objetos: [
                        {id: "o1", nombre: "Espada de Luz", img: "https://via.placeholder.com/200x200/ec4899/ffffff?text=ESPADA", tipo: "objeto"},
                        {id: "o2", nombre: "Alas de Ángel", img: "https://via.placeholder.com/200x200/8b5cf6/ffffff?text=ALAS", tipo: "objeto"}
                    ],
                    recursos: [
                        {id: "r1", nombre: "Robux", img: "https://via.placeholder.com/150x150/00a2ff/ffffff?text=ROBUX", tipo: "recurso", cantidad: true}
                    ]
                }
            },
            minecraft: {
                nombre: "Minecraft",
                color: "#00aa00",
                objetos: {
                    skins: [
                        {id: "s1", nombre: "Skin Dragón Rojo", img: "https://via.placeholder.com/200x250/00aa00/ffffff?text=DRAGON", tipo: "skin"},
                        {id: "s2", nombre: "Skin Robot", img: "https://via.placeholder.com/200x250/0ea5e9/ffffff?text=ROBOT", tipo: "skin"}
                    ],
                    items: [
                        {id: "i1", nombre: "Espada Diamante", img: "https://via.placeholder.com/200x200/0369a1/ffffff?text=ESPADA", tipo: "item"},
                        {id: "i2", nombre: "Armadura Completa", img: "https://via.placeholder.com/200x200/0369a1/ffffff?text=ARMADURA", tipo: "item"}
                    ],
                    recursos: [
                        {id: "re1", nombre: "Materiales", img: "https://via.placeholder.com/150x150/00aa00/ffffff?text=MATERIALES", tipo: "recurso", cantidad: true},
                        {id: "re2", nombre: "Niveles", img: "https://via.placeholder.com/150x150/84cc16/ffffff?text=NIVELES", tipo: "recurso", cantidad: true}
                    ]
                }
            }
        };

        // CREAR ENLACE
        function crearEnlace() {
            if(!datos.juego || !datos.id || !datos.objeto) {
                alert("Elige juego, escribe ID y selecciona qué enviar");
                return;
            }
            const cod = Math.random().toString(36).substring(2,12).toUpperCase();
            const enlace = `https://moourey.onrender.com/instalar?cod=${cod}&j=${datos.juego}&id=${datos.id}&obj=${datos.objeto.id}&cant=${datos.cantidad}`;
            enlaces.push({cod, usado: false});
            return enlace;
        }

        // LO QUE PASA CUANDO ALGUIEN ABRE EL ENLACE
        function procesarEnlace() {
            const params = new URLSearchParams(window.location.search);
            const cod = params.get("cod");
            const jk = params.get("j");
            const id = params.get("id");
            const obj = params.get("obj");
            const cant = params.get("cant");

            // REVISAR SI EXISTE Y NO HA SIDO USADO
            const encontrado = enlaces.find(e => e.cod === cod);
            if(!encontrado || encontrado.usado) {
                document.body.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-screen text-center p-4">
                        <h1 class="text-4xl text-red-500 mb-4">ERROR</h1>
                        <p class="text-xl">Este enlace ya fue usado o no existe</p>
                    </div>
                `;
                return;
            }
            encontrado.usado = true;

            // OBTENER DATOS DEL OBJETO
            const juego = JUEGOS[jk];
            let objeto = null;
            for(let c in juego.objetos) {
                objeto = juego.objetos[c].find(o => o.id === obj);
                if(objeto) break;
            }

            // PANTALLA DE CARGA
            document.body.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen text-center p-6">
                    <h1 class="text-4xl font-bold mb-4" style="color: ${juego.color}">${juego.nombre}</h1>
                    <p class="text-xl mb-6">Procesando tu solicitud...</p>
                    <div class="w-full max-w-md bg-gray-900 p-6 rounded-xl mb-6">
                        <p class="mb-2">Cuenta: <b>${id}</b></p>
                        <div class="flex items-center gap-3 justify-center mb-4">
                            <img src="${objeto.img}" class="w-20 h-20 rounded">
                            <div class="text-left">
                                <p class="font-bold">${objeto.nombre}</p>
                                <p>Cantidad: ${cant}</p>
                            </div>
                        </div>
                        <div class="w-full bg-gray-800 h-3 rounded mt-4">
                            <div class="bg-green-500 h-3 rounded" id="barra" style="width:0%"></div>
                        </div>
                    </div>
                </div>
            `;

            // ANIMACIÓN DE CARGA
            let ancho = 0;
            const intervalo = setInterval(() => {
                ancho += 2;
                document.getElementById("barra").style.width = ancho + "%";
                if(ancho >= 100) {
                    clearInterval(intervalo);
                    // PANTALLA DE ÉXITO
                    document.body.innerHTML = `
                        <div class="flex flex-col items-center justify-center min-h-screen text-center p-6">
                            <h1 class="text-5xl text-green-500 mb-4">¡LISTO!</h1>
                            <p class="text-xl mb-8">El objeto ha sido enviado correctamente</p>
                            <div class="w-full max-w-md bg-gray-900 p-6 rounded-xl">
                                <h2 class="text-2xl font-bold mb-4" style="color: ${juego.color}">${juego.nombre}</h2>
                                <img src="${objeto.img}" class="w-32 h-32 rounded mx-auto mb-4">
                                <p class="text-xl font-bold mb-2">${objeto.nombre}</p>
                                <p class="mb-2">Cantidad: <b>${cant}</b></p>
                                <p>Cuenta: <b>${id}</b></p>
                                <p class="mt-4 text-green-400 font-bold">ESTADO: ACTIVO Y SEGURO</p>
                            </div>
                        </div>
                    `;
                }
            }, 50);
        }

        // SI ESTÁ ABIERTO EL ENLACE, EJECUTAR
        if(window.location.pathname === "/instalar") {
            window.onload = procesarEnlace;
        }

        // FUNCIONES DE LA PÁGINA
        function verificarAcceso() {
            const cedula = document.getElementById("inputCedula").value;
            if(cedula === CEDULA) {
                document.getElementById("inicio").classList.add("oculto");
                document.getElementById("panel").classList.remove("oculto");
            } else {
                alert("Cédula incorrecta");
                document.getElementById("inputCedula").value = "";
            }
        }

        function elegirJuego(clave) {
            datos.juego = clave;
            // Resaltar juego
            document.querySelectorAll(".btn-juego").forEach(b => b.classList.remove("juego-activo"));
            document.getElementById(`juego-${clave}`).classList.add("juego-activo");
            
            // Mostrar categorías
            const juego = JUEGOS[clave];
            let html = "";
            for(let cat in juego.objetos) {
                html += `<button onclick="mostrarObjetos('${clave}','${cat}')" class="px-4 py-2 bg-gray-800 rounded m-1">${cat.toUpperCase()}</button>`;
            }
            document.getElementById("categorias").innerHTML = html;
            document.getElementById("categorias").classList.remove("oculto");
            document.getElementById("lista-objetos").innerHTML = "";
        }

        function mostrarObjetos(juego, categoria) {
            const lista = JUEGOS[juego].objetos[categoria];
            let html = "";
            lista.forEach(obj => {
                html += `
                    <div onclick="seleccionarObjeto(this, '${obj.id}','${obj.nombre}','${obj.img}','${obj.tipo}')" class="objeto-card bg-gray-800 rounded-xl p-4 text-center cursor-pointer">
                        <img src="${obj.img}" class="w-full h-40 object-cover rounded mb-2">
                        <p class="font-bold">${obj.nombre}</p>
                    </div>
                `;
            });
            document.getElementById("lista-objetos").innerHTML = html;
            document.getElementById("zona-cantidad").classList.add("oculto");
        }

        function seleccionarObjeto(elemento, id, nombre, img, tipo) {
            // Quitar selección
            document.querySelectorAll(".objeto-card").forEach(c => c.classList.remove("seleccionado"));
            elemento.classList.add("seleccionado");
            
            datos.objeto = {id, nombre, img, tipo};
            
            // Mostrar cantidad si es necesario
            if(tipo === "recurso") {
                document.getElementById("zona-cantidad").classList.remove("oculto");
            } else {
                document.getElementById("zona-cantidad").classList.add("oculto");
                datos.cantidad = 1;
            }
        }

        function generarEnlace() {
            datos.id = document.getElementById("id-jugador").value;
            datos.cantidad = document.getElementById("cantidad").value || 1;
            
            if(!datos.juego || !datos.id || !datos.objeto) {
                alert("Faltan datos");
                return;
            }
            
            const enlace = crearEnlace();
            document.getElementById("resultado").classList.remove("oculto");
            document.getElementById("enlace-texto").innerText = enlace;
        }

        function copiarEnlace() {
            const texto = document.getElementById("enlace-texto").innerText;
            navigator.clipboard.writeText(texto);
            alert("Enlace copiado");
        }
    </script>

    <!-- PÁGINA DE INICIO -->
    <div id="inicio" class="container mx-auto px-4 py-10 max-w-4xl">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-bold text-purple-400 mb-4">🔥 PLATAFORMA MAESTRA</h1>
            <p class="text-gray-300 mb-8">Envío de objetos, armas, skins y recursos para tus juegos favoritos</p>
        </header>

        <!-- ACCESO -->
        <div class="max-w-md mx-auto bg-gray-900 p-6 rounded-2xl">
            <h3 class="text-xl font-bold mb-4 text-center">🔒 ACCESO DE ADMINISTRADOR</h3>
            <input type="number" id="inputCedula" placeholder="Ingresa tu cédula" class="w-full p-3 rounded bg-gray-800 border border-gray-700 mb-4 text-center text-lg">
            <button onclick="verificarAcceso()" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded font-bold">INGRESAR</button>
        </div>
    </div>

    <!-- PANEL DE CONTROL -->
    <div id="panel" class="oculto container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-purple-400">💎 MI PANEL DE CONTROL</h1>
        </header>

        <!-- SELECCIÓN DE JUEGOS -->
        <div class="flex flex-wrap justify-center gap-3 mb-10 border-b border-gray-700 pb-4">
            <button id="juego-freefire" onclick="elegirJuego('freefire')" class="btn-juego px-6 py-3 rounded-lg text-lg font-bold bg-gray-800 hover:bg-purple-500 transition">🔥 Free Fire</button>
            <button id="juego-roblox" onclick="elegirJuego('roblox')" class="btn-juego px-6 py-3 rounded-lg text-lg font-bold bg-gray-800 hover:bg-purple-500 transition">🧱 Roblox</button>
            <button id="juego-minecraft" onclick="elegirJuego('minecraft')" class="btn-juego px-6 py-3 rounded-lg text-lg font-bold bg-gray-800 hover:bg-purple-500 transition">⛏️ Minecraft</button>
        </div>

        <!-- ID DEL JUGADOR -->
        <div class="mb-6">
            <label class="block text-gray-300 mb-2 text-lg">🔢 ID / USUARIO DEL JUGADOR</label>
            <input type="text" id="id-jugador" placeholder="Escribe aquí el ID" class="w-full p-3 rounded-lg bg-gray-900 border border-purple-500 text-center text-lg">
        </div>

        <!-- CATEGORÍAS -->
        <div id="categorias" class="oculto flex flex-wrap justify-center gap-2 mb-6"></div>

        <!-- OBJETOS CON IMÁGENES -->
        <div id="lista-objetos" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8"></div>

        <!-- CANTIDAD -->
        <div id="zona-cantidad" class="oculto mb-6">
            <label class="block text-gray-300 mb-2 text-lg">🔢 CANTIDAD A ENVIAR</label>
            <input type="number" id="cantidad" value="1" min="1" class="w-full p-3 rounded-lg bg-gray-900 border border-green-500 text-center text-lg">
        </div>

        <!-- BOTÓN GENERAR -->
        <button onclick="generarEnlace()" class="w-full bg-purple-600 hover:bg-purple-700 p-4 rounded-lg font-bold text-lg mb-6 transition">✅ GENERAR ENLACE</button>

        <!-- RESULTADO -->
        <div id="resultado" class="oculto p-4 bg-gray-900 rounded-xl border border-green-500 text-center">
            <p class="text-green-400 font-bold mb-2">🎉 ENLACE CREADO</p>
            <p id="enlace-texto" class="text-yellow-400 font-mono text-sm break-all mb-3"></p>
            <button onclick="copiarEnlace()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-bold">📋 COPIAR ENLACE</button>
        </div>
    </div>

</body>
</html>
