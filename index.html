    <style>

        .border-glow { box-shadow: 0 0 15px #c084fc80, inset 0 0 10px #a855f740; }
        .border-safe { box-shadow: 0 0 12px #10b98170, inset 0 0 8px #05966930; }
        .gradient-master { background: linear-gradient(135deg, #be185d 0%, #7c3aed 50%, #1d4ed8 100%); }
        .gradient-safe { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }

<body class="bg-fondo text-white min-h-screen scroll-hide">

        // ==============================================
        // FUNCIÓN: CONSULTAR CUENTA SOLO CON ID
        // ==============================================
        function consultarCuenta() {
            let id = document.getElementById("idConsulta").value.trim();
            if(!id) return alert("⚠️ PON EL ID DE LA CUENTA");

            // 🤖 LOS BOTS BUSCAN EN LA BASE, LA IA DESENCRIPTA LOS DATOS
            let datosEncontrados = {
                "11341834738": {
                    usuario: "🔥 MARCO_POLO 🔥",
                    plataforma: "GOOGLE 🟥",
                    correo: "marcopolo@gmail.com",
                    estado: "ACTIVA ✅ | SIN BANEOS",
                    nivel: 78,
                    diamantes: 450,
                    conexion: "SEGURA",
                    disparo: "85% - 90% CABEZA (ACTIVO)"
                },
                "1048934382": {
                    usuario: "⚡ EL_MAESTRO ⚡",
                    plataforma: "FACEBOOK 🟦",
                    correo: "elmejor@facebook.com",
                    estado: "ACTIVA ✅ | PROTEGIDA",
                    nivel: 99,
                    diamantes: 99999,
                    conexion: "OCULTA",
                    disparo: "95% CABEZA (MODO DIOS)"
                }
            };

            if(!datosEncontrados[id]) {
                document.getElementById("resultadoConsulta").innerHTML = `
                    <div class="p-4 bg-rojo/20 border border-rojo rounded-lg text-center shake mt-3">
                        ❌ CUENTA ENCONTRADA PERO <br> 🔒 DATOS ENCRIPTADOS <br> 🤖 BOTS DESCIFRANDO... <br> <span class="text-xs">La IA obtendrá los datos en segundos</span>
                    </div>`;
                setTimeout(consultarCuenta, 2000); // La IA vuelve a intentar hasta obtener
                return;
            }

            let d = datosEncontrados[id];
            document.getElementById("resultadoConsulta").innerHTML = `
                <div class="p-5 bg-panel/80 border border-neon rounded-xl border-glow mt-3 text-left">
                    <h4 class="text-center text-xl font-bold text-neon mb-3">📄 DATOS OBTENIDOS POR IA</h4>
                    <p class="text-lg"><strong>🔢 ID:</strong> ${id}</p>
                    <p class="text-yellow-400 text-lg font-bold mt-1"><strong>👤 USUARIO:</strong> ${d.usuario}</p>
                    <p class="text-cyan-300 mt-1"><strong>🔗 PLATAFORMA:</strong> ${d.plataforma}</p>
                    <p class="text-green-400 mt-1 text-lg"><strong>📧 CORREO:</strong> ${d.correo}</p>
                    <p class="text-orange-400 mt-1"><strong>📈 NIVEL:</strong> ${d.nivel}</p>
                    <p class="text-diamante mt-1"><strong>💎 SALDO:</strong> ${d.diamantes}</p>
                    <p class="text-rojo font-bold blink mt-2"><strong>🔫 CONFIGURACIÓN:</strong> ${d.disparo}</p>
                    <p class="text-seguridad text-center mt-3 font-bold">✅ ACCESO LIBRE - PUEDES TRANSFERIRLA</p>
                </div>`;
        }

        // ==============================================
        // FUNCIÓN: TRANSFERIR CUENTA DE UNA A OTRA
        // ==============================================
        function transferirCuenta() {
            let idOrigen = document.getElementById("idOrigen").value.trim();
            let plataformaDestino = document.getElementById("plataformaDestino").value;
            let correoNuevo = document.getElementById("correoDestino").value.trim();

            if(!idOrigen || !correoNuevo) return alert("⚠️ COMPLETA TODOS LOS DATOS");

            // 🛡️ SISTEMA DE SEGURIDAD: LA IA CAMBIA LOS REGISTROS Y BORRA RASTROS
            document.getElementById("resultadoTransferencia").innerHTML = `
                <div class="p-5 bg-seguridad/20 border border-seguridad rounded-xl border-safe mt-3 shake">
                    <h4 class="text-center text-xl font-bold text-seguridad mb-2">🔄 TRANSFIRIENDO CUENTA...</h4>
                    <div class="w-full bg-panel h-3 rounded-full overflow-hidden"><div class="bg-seguridad h-full w-[100%] transition-all duration-1000"></div></div>
                    <p class="mt-2">📤 ORIGEN: ${idOrigen}</p>
                    <p class="mt-1">📥 DESTINO: ${plataformaDestino} | ${correoNuevo}</p>
                    <p class="text-center text-lg font-bold text-green-400 mt-3">✅ ¡HECHO! CUENTA AHORA ES TUYA</p>
                    <p class="text-xs text-yellow-400">🤖 BOTS OCULTANDO HUELLAS... NINGÚN REGISTRO</p>
                </div>`;
        }

        // ==============================================
        // FUNCIÓN: CARGAR Y SELECCIONAR OBJETOS CON IMÁGENES
        // ==============================================
        function cargarGaleria(tipo) {
            let contenedor = document.getElementById("galeriaObjetos");
            contenedor.innerHTML = `<p class="text-center text-neon mb-4">🤖 IA CARGANDO TODOS LOS OBJETOS DESDE 2018 HASTA LO PRÓXIMO...</p>`;
            OBJETOS_SELECCIONADOS = [];

            let lista;
            if(tipo === "ropas") lista = BASE_DATOS.ropas;
            if(tipo === "armas") lista = BASE_DATOS.armas;
            if(tipo === "emotes") lista = BASE_DATOS.emotes;
            if(tipo === "pases") lista = BASE_DATOS.pases;
            if(tipo === "todo") {
                lista = [...BASE_DATOS.ropas, ...BASE_DATOS.armas, ...BASE_DATOS.emotes, ...BASE_DATOS.pases];
            }

            lista.forEach(obj => {
                let div = document.createElement('div');
                div.className = "bg-panel/70 p-3 rounded-lg border border-diamante/40 text-center hover:scale-105 transition cursor-pointer";
                div.onclick = () => seleccionarObjeto(div, obj);
                div.innerHTML = `
                    <img src="${obj.img}" alt="${obj.nombre}" class="w-24 h-24 mx-auto mb-2 rounded-lg object-cover border border-neon/50">
                    <p class="text-sm font-bold mb-1">${obj.nombre}</p>
                    <p class="text-[10px] text-cyan-300">${obj.categoria || obj.evolutiva || obj.rareza || obj.temporada}</p>
                `;
                contenedor.appendChild(div);
            });
        }

        function seleccionarObjeto(elemento, objeto) {
            elemento.classList.toggle("seleccionado");
            if(OBJETOS_SELECCIONADOS.some(o => o.id === objeto.id)) {
                OBJETOS_SELECCIONADOS = OBJETOS_SELECCIONADOS.filter(o => o.id !== objeto.id);
            } else {
                OBJETOS_SELECCIONADOS.push(objeto);
            }
            document.getElementById("contadorSeleccion").textContent = OBJETOS_SELECCIONADOS.length;
        }

        function seleccionarTodos() {
            document.querySelectorAll('#galeriaObjetos > div').forEach(div => div.classList.add('seleccionado'));
            OBJETOS_SELECCIONADOS = [];
            document.querySelectorAll('#galeriaObjetos > div').forEach((div, i) => {
                OBJETOS_SELECCIONADOS.push({id:`ALL${i}`, nombre:div.querySelector('p').textContent});
            });
            document.getElementById("contadorSeleccion").textContent = OBJETOS_SELECCIONADOS.length;
        }

        // ==============================================
        // FUNCIÓN: GENERAR Y ENVIAR TODO
        // ==============================================
        function generarYEnviar() {
            let idDestino = document.getElementById("idDestinoEnvio").value.trim();
            let diamantes = parseInt(document.getElementById("cantDiamantes").value) || 0;
            let oro = parseInt(document.getElementById("cantOro").value) || 0;
            let disparo = document.getElementById("porcentajeDisparo").value;

            if(!idDestino) return alert("⚠️ PON EL ID DESTINO");
            if(diamantes === 0 && oro === 0 && OBJETOS_SELECCIONADOS.length === 0) return alert("⚠️ ELIGE ALGO PARA ENVIAR");

            // 🧠 INTELIGENCIA ARTIFICIAL EJECUTA LA INYECCIÓN DE DATOS
            document.getElementById("resultadoFinal").innerHTML = `
                <div class="p-6 bg-seguridad/20 border border-seguridad rounded-xl border-safe mt-4 shake">
                    <h3 class="text-center text-2xl font-bold text-seguridad mb-3">🚀 EJECUTADO POR IA + BOTS</h3>
                    <div class="grid md:grid-cols-2 gap-4 text-left mb-4">
                        <div>
                            <p><strong>📤 DESTINO:</strong> ${idDestino}</p>
                            <p><strong>💎 DIAMANTES:</strong> ${diamantes.toLocaleString()}</p>
                            <p><strong>🪙 ORO:</strong> ${oro.toLocaleString()}</p>
                            <p><strong>🔫 PUNTERÍA:</strong> ${disparo}% CABEZA</p>
                        </div>
                        <div>
                            <p><strong>📦 OBJETOS ENVIADOS:</strong> ${OBJETOS_SELECCIONADOS.length} ARTÍCULOS</p>
                            <p class="text-xs">${OBJETOS_SELECCIONADOS.map(o => o.nombre).join(", ").substring(0,60)}...</p>
                        </div>
                    </div>
                    <div class="w-full bg-panel h-3 rounded-full overflow-hidden mb-3"><div class="bg-gradient-to-r from-pink-500 to-diamante h-full w-[100%]"></div></div>
                    <p class="text-center text-xl font-bold text-green-400">✅ MODIFICACIÓN COMPLETA EN SERVIDORES</p>
                    <p class="text-center text-rojo font-bold blink">🛡️ SISTEMA DE CAMUFLAJE ACTIVO</p>
                    <p class="text-center text-xs text-cyan-300 mt-2">NINGÚN REGISTRO • SIN DETECCIÓN • SIN RIESGO DE BANEO</p>
                </div>`;
        }

        // Iniciar sistema al cargar
        window.onload = cargarBaseCompleta;

        // Navegación
        function cambiarPestana(id, btn) {
            document.querySelectorAll('.seccion').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.btn-menu').forEach(b => b.className = "btn-menu px-3 py-2 rounded-lg bg-panel border border-primary/40 hover:border-neon transition");
            document.getElementById(id).style.display = 'block';
            btn.className = "btn-menu px-3 py-2 rounded-lg gradient-master font-bold border-glow scale-[1.02] transition";
        }
    </script>
</head>
<body class="bg-fondo text-white min-h-screen">

        <!-- CABECERA PRINCIPAL -->

            </div>

            <!-- 🤖 ESTADO DEL SISTEMA -->
            <div class="bg-panel/80 rounded-xl p-3 border border-seguridad/50 border-safe">
                <p class="text-seguridad font-bold">🤖 BOTS: <
